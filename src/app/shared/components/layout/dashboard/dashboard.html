<div class="flex h-screen bg-gray-100 font-sans">
  <!-- Sidebar -->
  <aside class="w-64 bg-[#f5f6fb] text-slate-800 flex flex-col border-r border-slate-200">
    
    <!-- Logo & Header -->
    <div class="p-6 flex items-center gap-3">
      <div class="bg-blue-600 text-white p-2 rounded-lg flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
          <path fill-rule="evenodd" d="M3 6a3 3 0 013-3h12a3 3 0 013 3v12a3 3 0 01-3 3H6a3 3 0 01-3-3V6zm4.5 7.5a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zm3.75-1.5a.75.75 0 00-1.5 0v3.75a.75.75 0 001.5 0V12zm3.75-1.5a.75.75 0 00-1.5 0v5.25a.75.75 0 001.5 0v-5.25z" clip-rule="evenodd" />
        </svg>
      </div>
      <div>
        <h1 class="text-[17px] font-bold text-slate-900 leading-tight tracking-tight">RiskManager Pro</h1>
        <p class="text-xs text-slate-500 font-medium">Corporate Credit</p>
      </div>
    </div>

    <nav class="flex-1 mt-2 flex flex-col gap-1.5">
      <a 
        routerLink="/finanzas" 
        routerLinkActive="bg-blue-300 text-blue-900" 
        [routerLinkActiveOptions]="{exact: true}"
        class="mx-4 flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-20/50 hover:text-slate-900 rounded-xl font-medium text-sm transition-colors cursor-pointer">
        <!-- Grid Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
        </svg>
        Dashboard
      </a>
      
      <a 
        routerLink="/finanzas/lista" 
        routerLinkActive="bg-blue-300 text-blue-900" 
        [routerLinkActiveOptions]="{exact: true}"
        class="mx-4 flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-20/50 hover:text-slate-900 rounded-xl font-medium text-sm transition-colors cursor-pointer">        <!-- Users Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5 text-slate-500">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
        </svg>
        Clients
      </a>
      
      <a class="mx-4 flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-200/50 hover:text-slate-900 rounded-xl font-medium text-sm transition-colors cursor-pointer">
        <!-- Chart Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5 text-slate-500">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
        </svg>
        Reports
      </a>
      
      <a class="mx-4 flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-200/50 hover:text-slate-900 rounded-xl font-medium text-sm transition-colors cursor-pointer">
        <!-- Cog Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5 text-slate-500">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.34 15.84c-.4-.4-.4-1.04 0-1.44l3.1-3.1-3.1-3.1c-.4-.4-.4-1.04 0-1.44.4-.4 1.04-.4 1.44 0l3.82 3.82c.4.4.4 1.04 0 1.44l-3.82 3.82c-.4.4-1.04.4-1.44 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 100-18 9 9 0 000 18z" />
        </svg>
        Settings
      </a>
    </nav>

    <!-- Logout & Footer -->
    <div class="px-6 py-6 mt-auto">
      <div class="border-t border-slate-300 pt-4">
        <button (click)="logout()" class="flex items-center gap-3 px-2 py-2 w-full text-slate-600 hover:text-slate-900 font-medium text-sm transition-colors cursor-pointer">
          <!-- Logout Out Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="w-5 h-5 text-slate-500">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
          </svg>
          Logout
        </button>
      </div>
    </div>
    
  </aside>

  <main class="flex-1 overflow-y-auto bg-white">
    <router-outlet></router-outlet>
  </main>
</div>
